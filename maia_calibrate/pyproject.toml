[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maia-calibrate"
version = "0.1.0"
description = "Measured dial and temperature settings that make Maia-3 play at a target rating"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
packages = ["maia_calibrate"]
package-dir = {maia_calibrate = "."}

[tool.setuptools.package-data]
maia_calibrate = ["maia3_79m.json"]

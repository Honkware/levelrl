[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-eval"
version = "0.1.0"
description = "Small, model-agnostic tools for evaluating chess policies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["chess>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["chess_eval"]
package-dir = {chess_eval = "."}
include-package-data = false
